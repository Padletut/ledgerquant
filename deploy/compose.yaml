name: ledgerquant-capture

services:
  postgres:
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    restart: unless-stopped
    environment:
      POSTGRES_DB: ledgerquant
      POSTGRES_USER: ledgerquant
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerquant -d ledgerquant"]
      interval: 5s
      timeout: 3s
      retries: 12

  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.capture
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    user: "${LEDGERQUANT_SECRET_UID:-1000}:${LEDGERQUANT_SECRET_GID:-1000}"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    environment: &database_environment
      DB_HOST: postgres
      DB_NAME: ledgerquant
      DB_USER: ledgerquant
      DB_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    depends_on:
      postgres:
        condition: service_healthy

  capture:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.capture
    restart: unless-stopped
    user: "${LEDGERQUANT_SECRET_UID:-1000}:${LEDGERQUANT_SECRET_GID:-1000}"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    secrets:
      - postgres_password
      - collector_token
    environment:
      <<: *database_environment
      COLLECTOR_TOKEN_FILE: /run/secrets/collector_token
    ports:
      - "127.0.0.1:${LEDGERQUANT_INGEST_PORT:-18080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 6

  ingress:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    tmpfs:
      - /tmp
    environment:
      CAPTURE_INGRESS_HOST: ${LEDGERQUANT_INGEST_HTTPS_HOST:-192.168.10.155}
    ports:
      - "${LEDGERQUANT_INGEST_HTTPS_HOST:-192.168.10.155}:${LEDGERQUANT_INGEST_HTTPS_PORT:-18443}:18443"
    volumes:
      - ./Caddyfile.capture:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      capture:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 3s
      retries: 6

  news:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.capture
    command: ["python", "-m", "ledgerquant.news.collector"]
    restart: unless-stopped
    user: "${LEDGERQUANT_SECRET_UID:-1000}:${LEDGERQUANT_SECRET_GID:-1000}"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    secrets:
      - postgres_password
      - fred_api_key
    environment:
      <<: *database_environment
      NEWS_POLL_SECONDS: "300"
      NEWS_GDELT_CATCH_UP_HOURS: "6"
      NEWS_FRED_POLL_SECONDS: "21600"
      FRED_API_KEY_FILE: /run/secrets/fred_api_key
    depends_on:
      migrate:
        condition: service_completed_successfully

secrets:
  postgres_password:
    file: ${LEDGERQUANT_POSTGRES_PASSWORD_FILE:-../credentials/postgres.pwd}
  collector_token:
    file: ${LEDGERQUANT_COLLECTOR_TOKEN_FILE:-../credentials/collector-token.txt}
  fred_api_key:
    file: ${LEDGERQUANT_FRED_API_KEY_FILE:-../credentials/fred-api.key}

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
