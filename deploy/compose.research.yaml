# Use together with compose.yaml. Neither service starts with the capture stack.
x-model-profile: &model_profile ../configs/research/openai_gpt54_mini.profile.json:/run/config/model-profile.json:ro

services:
  research-worker:
    profiles: [research]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.capture
    entrypoint: [python, -m, ledgerquant.research.agent_cli]
    command: [--help]
    restart: "no"
    user: "${LEDGERQUANT_SECRET_UID:-1000}:${LEDGERQUANT_SECRET_GID:-1000}"
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    tmpfs: [/tmp]
    environment:
      DB_HOST: postgres
      DB_NAME: ledgerquant
      DB_USER: ledgerquant_research_worker
      DB_PASSWORD_FILE: /run/secrets/research_worker_password
      OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
      MODEL_PROFILE_FILE: /run/config/model-profile.json
    secrets: [research_worker_password, openai_api_key]
    volumes:
      - ../data/research_control/worker:/control:ro
      - *model_profile

  research-operator:
    profiles: [research]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.capture
    entrypoint: [python, -m, ledgerquant.research.agent_cli]
    command: [--help]
    restart: "no"
    user: "${LEDGERQUANT_SECRET_UID:-1000}:${LEDGERQUANT_SECRET_GID:-1000}"
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    tmpfs: [/tmp]
    environment:
      DB_HOST: postgres
      DB_NAME: ledgerquant
      DB_USER: ledgerquant
      DB_PASSWORD_FILE: /run/secrets/postgres_password
      MODEL_PROFILE_FILE: /run/config/model-profile.json
    secrets: [postgres_password, research_worker_password]
    volumes:
      - ../data/research_control/operator:/control:ro
      - *model_profile

secrets:
  research_worker_password:
    file: ../credentials/research-worker.pwd
  openai_api_key:
    file: ../credentials/openai-api.key
